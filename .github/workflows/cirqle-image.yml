# CIRQLE: builds the patched bridge image that runs on cirqle-vps-misc.
# Every push to `cirqle` publishes ghcr.io/tesla-prep/mautrix-whatsapp:cirqle-<short sha>.
name: CIRQLE image

on:
  push:
    branches: [cirqle]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tesla-prep/mautrix-whatsapp:cirqle-${{ steps.sha.outputs.short }}
            ghcr.io/tesla-prep/mautrix-whatsapp:cirqle
          cache-from: type=gha
          cache-to: type=gha,mode=max
