# CIRQLE: builds the patched bridge image that runs on cirqle-vps-misc.
# Every push to `cirqle` or a `cirqle-*` branch publishes ghcr.io/tesla-prep/mautrix-whatsapp:cirqle-<short sha>;
# `cirqle` also moves the :cirqle tag.
name: CIRQLE image

on:
  push:
    branches: [cirqle, 'cirqle-*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/tesla-prep/mautrix-whatsapp:cirqle-${{ steps.sha.outputs.short }}
            ${{ github.ref == 'refs/heads/cirqle' && 'ghcr.io/tesla-prep/mautrix-whatsapp:cirqle' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push
        run: docker push --all-tags ghcr.io/tesla-prep/mautrix-whatsapp
      # The package is private, so the server loads the image from this artifact:
      #   gh run download <run> -R tesla-prep/mautrix-whatsapp -n image
      #   ssh root@87.99.156.47 'gunzip -c | docker load' < image.tar.gz
      - name: Save image
        run: docker save ghcr.io/tesla-prep/mautrix-whatsapp:cirqle-${{ steps.sha.outputs.short }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 90
